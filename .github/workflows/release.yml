# Signed bundle → Google Play. Triggered by pushing a tag like v1.0.1, or manually.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DECKLE_UPLOAD_KEYSTORE_BASE64  base64 of D:/Keys/deckle-upload.jks
#   DECKLE_KEYSTORE_PASSWORD       keystore password
#   DECKLE_KEY_ALIAS               deckle
#   DECKLE_KEY_PASSWORD            key password
#   PLAY_SERVICE_ACCOUNT_JSON      Google Cloud service-account key with release rights in Play Console
# Optional repository variable:
#   PLAY_RELEASE_STATUS            "draft" (default, required while the app is unpublished) or "completed"
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version name (e.g. 1.0.1). versionCode is derived from it.
        required: true
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          name="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! $name =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version '$name' is not MAJOR.MINOR.PATCH"; exit 1
          fi
          (( BASH_REMATCH[2] < 100 && BASH_REMATCH[3] < 100 )) || { echo "minor/patch must be < 100"; exit 1; }
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $name ($code)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew test

      - name: Decode upload key
        env:
          KEYSTORE_B64: ${{ secrets.DECKLE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          [[ -n $KEYSTORE_B64 ]] || { echo "Secret DECKLE_UPLOAD_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        env:
          DECKLE_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          DECKLE_KEYSTORE_PASSWORD: ${{ secrets.DECKLE_KEYSTORE_PASSWORD }}
          DECKLE_KEY_ALIAS: ${{ secrets.DECKLE_KEY_ALIAS }}
          DECKLE_KEY_PASSWORD: ${{ secrets.DECKLE_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease
          -Pdeckle.versionCode=${{ steps.version.outputs.code }}
          -Pdeckle.versionName=${{ steps.version.outputs.name }}

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: "Gate: no network permission, permission snapshot"
        run: bash tools/ci/check-merged-manifest.sh

      - name: "Gate: signed with the upload key"
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          signer=$(keytool -printcert -jarfile "$aab")
          echo "$signer" | grep -E 'Owner:|SHA256:'
          if echo "$signer" | grep -q 'CN=Android Debug'; then echo "Bundle is debug-signed"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: deckle-${{ steps.version.outputs.name }}-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.avyaanstudios.deckle
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ inputs.track || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          whatsNewDirectory: distribution/whatsnew
